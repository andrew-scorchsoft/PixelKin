# The release gates the design docs call "binding": types must compile, the
# roster must validate, the type chart must stay inside the fair-fight band,
# and the journey model must stay solvent. Anything here failing means a data
# or balance contract broke — fix the data (or the mirrored constants), don't
# skip the check. See CLAUDE.md "Gotchas & learned steers".
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Roster schema + power budget + evolution lines
        run: node tools/balance/validate.mjs
      - name: Type chart fair-fight band
        run: node tools/balance/chart_check.mjs
      - name: Full-roster balance sim
        run: node tools/balance/simulate.mjs
      - name: Journey progression + wick economy
        run: node tools/balance/progression.mjs
      # Map/scene gates: a route the player can't actually walk passes every
      # per-map picture check, so we walk the world. audit_region's FOOT-PATH
      # check catches main-path splits (an ungated exit stranded behind a Gift —
      # the Dimglass Coast dead-end); audit_flow/audit_warps catch reachability,
      # choke and warp-coverage regressions. Pure-stdlib Python, no deps.
      - name: Region scene audit (graph sync, progression, foot-path)
        run: python3 tools/maps/audit_region.py
      - name: Per-map flow audit (reachability, chokes, pacing)
        run: python3 tools/maps/audit_flow.py
      - name: Warp audit (entrance coverage, landings, round trips)
        run: python3 tools/maps/audit_warps.py
