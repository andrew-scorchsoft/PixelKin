# The release gates the design docs call "binding": types must compile, the
# roster must validate, the type chart must stay inside the fair-fight band,
# and the journey model must stay solvent. Anything here failing means a data
# or balance contract broke — fix the data (or the mirrored constants), don't
# skip the check. See CLAUDE.md "Gotchas & learned steers".
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Every script/dialogue ref, portrait+expr, NPC/object sprite resolves; every
      # flag read is set somewhere; no progression step hangs on an optional guard.
      # (It caught the unreachable Starfall Vigils and Georgina's unfinishable quest.)
      - name: Content integrity (refs, portraits, sprites, flags)
        run: node tools/content/check_content.mjs
      - name: Roster schema + power budget + evolution lines
        run: node tools/balance/validate.mjs
      - name: Type chart fair-fight band
        run: node tools/balance/chart_check.mjs
      - name: Full-roster balance sim
        run: node tools/balance/simulate.mjs
      - name: Journey progression + wick economy
        run: node tools/balance/progression.mjs
      # Map/scene gates: a route the player can't actually walk passes every
      # per-map picture check, so we walk the world. audit_region's FOOT-PATH
      # check catches main-path splits (an ungated exit stranded behind a Gift —
      # the Dimglass Coast dead-end); audit_flow/audit_warps catch reachability,
      # choke and warp-coverage regressions. Pure-stdlib Python, no deps.
      - name: Region scene audit (graph sync, progression, foot-path)
        run: python3 tools/maps/audit_region.py
      - name: Per-map flow audit (reachability, chokes, pacing)
        run: python3 tools/maps/audit_flow.py
      - name: Warp audit (entrance coverage, landings, round trips)
        run: python3 tools/maps/audit_warps.py
      # The whole journey at TILE level: cold open -> dawn with only the Gifts and
      # flags earned so far; grants fire only when the granting NPC/trigger/cache
      # is itself reachable. FAILs a prop sealing a warden/band/cache, a beat that
      # needs a LATER Gift than canon, and any unreached map/content/warp. Uses
      # node + esbuild (from npm ci) to dump the content registries.
      - name: Remastered-music manifest + music page data are current
        run: |
          python3 tools/audio/build_remaster_manifest.py --check
          node tools/build/build_music_data.mjs --check
      - name: Journey audit (tile-level cold open -> dawn replay)
        run: python3 tools/maps/audit_journey.py
      - name: Python tools compile (builders, runners, asset tools)
        run: python3 -m py_compile tools/maps/*.py tools/maps/worldcraft/*.py tools/assets/*.py .claude/skills/generate-sprite-sheet/scripts/*.py
      - name: Spatial audit (edge geometry)
        run: python3 tools/maps/audit_spatial.py
      # The LOOK gate: the play audits pass on an empty green field with ruled
      # boxes; this FAILs flat voids and box pools (docs/reviews/world-craft-panel.md).
      - name: Look gate (flat voids, box pools)
        run: python3 tools/maps/audit_visual.py --all --strict
      # Shipped maps are written by builders AND these id-keyed runners; a
      # runner that would change a shipped map means someone hand-edited around it.
      - name: Post-build runners have no drift
        run: |
          python3 tools/maps/add_hand_placed.py --check
          python3 tools/maps/add_peril_thread.py --check
          python3 tools/maps/add_world_craft.py --check
          python3 tools/maps/vary_trees.py --check
      - run: pip install "Pillow>=10" "numpy>=1.26"
      # The whole map pipeline (every builder -> the four runners) re-run in a
      # scratch git worktree must reproduce every shipped map EXACTLY (~1 min) —
      # a builder that would regress a shipped map is caught here, not on rebuild.
      - name: Map pipeline reproduces every shipped map
        run: python3 tools/maps/check_rebuild.py
      # Walkability against the TRUE entrances: FAILs a softlock (a flag-gated warp you
      # can only stand on by using a Gift) or a sealed pocket that strands content.
      - name: Walkability (softlocks, stranded content)
        run: python3 tools/maps/render_walkable.py --all --report-only
      - name: Sprite standards (canvas, alpha, anchors)
        run: python3 .claude/skills/generate-sprite-sheet/scripts/validate_sprites.py --all
      - name: Walk-cycle facing (no stray frame breaks the cycle)
        run: python3 .claude/skills/generate-sprite-sheet/scripts/check_walk_facing.py $(ls assets/trainers/*.png | grep -v _actions)
